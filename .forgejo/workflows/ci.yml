name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Just
        run: |
          apt-get update
          apt-get install -y --no-install-recommends just
      - name: Run CI
        run: just ci
