on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    # Vite inlines VITE_* at build time; without this the deployed bundle
    # cannot authenticate with Spotify.
    env:
      VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: https://github.com/DeterminateSystems/nix-installer-action@v23
      # PRs cannot read secrets, and must never overwrite the live site.
      - name: Check deploy configuration
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for v in VITE_SPOTIFY_CLIENT_ID CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::$v is unset"; exit 1; }
          done
      - run: nix develop --command just ci
      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # GITHUB_REPOSITORY is "<owner>/<repo>"; Pages names must be lowercase.
          nix develop --command npx wrangler@4.146.0 pages deploy dist \
            --project-name="$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
